name: Build Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Install Dependencies & Init Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          cp index.html www/
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.royalrasoi.app",
            "appName": "Royal Rasoi",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          npx cap add android

      - name: Build Debug APK & Release Bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew bundleRelease

      - name: Upload APK (For Testing)
        uses: actions/upload-artifact@v4
        with:
          name: Royal-Rasoi-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB (For Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: Royal-Rasoi-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
