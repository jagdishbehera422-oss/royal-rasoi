Name: Build Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Capacitor & Prepare Web Assets
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir -p www
          cp index.html www/
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.royalrasoi.app",
            "appName": "Royal Rasoi",
            "webDir": "www"
          }
          EOF
          npx cap add android
          sed -i 's/minSdkVersion = .*/minSdkVersion = 24/g' android/variables.gradle
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/g' android/variables.gradle
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/g' android/variables.gradle
          sed -i 's/versionCode 1/versionCode 3/g' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.2"/g' android/app/build.gradle

      - name: Generate Custom App Icons & Splash Screen
        run: |
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Release Bundle (AAB)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Sign Release AAB
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore royal-rasoi-key.jks android/app/build/outputs/bundle/release/app-release.aab royalrasoi -storepass royal1234

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: Royal-Rasoi-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: Royal-Rasoi-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
