name: Build Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Capacitor & Prepare Web Assets
        run: |
          npm init -y
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
          mkdir -p www
          cp index.html www/
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.royalrasoi.app",
            "appName": "Royal Rasoi",
            "webDir": "www"
          }
          EOF
          npx cap add android
          sed -i 's/minSdkVersion = 22/minSdkVersion = 24/g' android/variables.gradle
          sed -i 's/targetSdkVersion = 33/targetSdkVersion = 35/g' android/variables.gradle
          sed -i 's/compileSdkVersion = 33/compileSdkVersion = 35/g' android/variables.gradle

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Release Bundle (AAB)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Sign Release AAB
        run: |
          keytool -genkey -v -keystore royal-rasoi-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias royalrasoi -storepass royal1234 -keypass royal1234 -dname "CN=Jagdish Behera, OU=Apex Forge Studio, O=Apex Forge Studio, L=Kunda, S=UP, C=IN"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore royal-rasoi-key.jks android/app/build/outputs/bundle/release/app-release.aab royalrasoi -storepass royal1234

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: Royal-Rasoi-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: Royal-Rasoi-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Signing Keystore (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: Royal-Rasoi-Keystore-Backup
          path: royal-rasoi-key.jks
